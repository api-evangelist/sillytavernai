aid: sillytavernai

name: SillyTavern AI

image: https://docs.sillytavern.app/static/banner.png

description: SillyTavern AI provides an open-source, extensible AI chat interface that allows users to create and customize AI characters for
  role‑playing, storytelling, and interactive experiences. It supports multiple AI back‑ends, plug‑in extensions, and a rich UI for managing character
  lore, dialogue, and visual assets. The platform is community‑driven, with frequent updates and a growing ecosystem of tools and integrations,
  enabling creators to build immersive conversational worlds.

